[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upas"
version = "1.0.0"
description = "Universal Project Automation Standard (UPAS) — Unified Lifecycle CLI & Automation Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Antigravity Engineering", email = "engineering@example.com" }
]
keywords = ["automation", "lifecycle", "cicd", "deployment", "verification", "oidc", "testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "jsonschema>=4.20.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "psutil>=5.9.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
upas = "upas_core.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["upas_core*"]

[tool.setuptools.package-data]
upas_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
